on:
  workflow_call: 
    inputs:
      forRelease:
        description: 'Run for release?'
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Git Semantic Version
      id: version
      uses: PaulHatch/semantic-version@5ae1354e589c5a67345fb2c6e65b025ff676d7c7 # v6.0.7
      with:
        tag_prefix: ''
        version_format: "${major}.${minor}.${patch}${{ !inputs.forRelease && '-preview${increment}' || '' }}"
        search_commit_body: true

    - name: Setup dotnet from global.json
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        global-json-file: global.json

    - name: Build and Pack
      run: dotnet build -c Release -p:Version=${{ steps.version.outputs.version}}

    - name: Run tests
      run: dotnet test -c Release --no-build --report-trx --report-trx-filename "{asm}_report.trx" --coverage --coverage-output-format cobertura

    - name: Upload dotnet test results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: ${{ !cancelled() }}
      with:
        name: .NET Tests
        path: 'TestResults/*_report.trx'
        reporter: dotnet-trx
        fail-on-error: true

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate code coverage report
      run: |
        reportgenerator \
        -reports:"**/TestResults/**/*.cobertura.xml" \
        -targetDir:"codecoveragereport" \
        -reporttypes:"Html;MarkdownSummaryGitHub"

    - name: Publish code coverage summary
      run: cat codecoveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: Upload code coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: code-coverage-report
        path: codecoveragereport

    - name: Upload package artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: packages
        path: "**/*.nupkg"