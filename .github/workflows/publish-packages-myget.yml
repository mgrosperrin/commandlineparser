on:
  workflow_call: 
    inputs:
      environmentName:
        description: "Name of the environment"
        required: true
        type: string
      feedUrl:
        description: 'NuGet feed URL'
        required: true
        type: string
    secrets:
      feedAPIKey:
        description: 'NuGet feed API key'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environmentName }}
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
    
      - name: Push to NuGet package feed
        env:
          NUGET_URL: ${{ inputs.feedUrl }}
          NUGET_API_KEY: ${{ secrets.feedAPIKey }}
        run: dotnet nuget push '**/*.nupkg' --source "$NUGET_URL" --api-key "$NUGET_API_KEY"